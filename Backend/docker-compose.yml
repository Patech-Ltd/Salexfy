services:
  db:
    image: postgres:16-alpine
    container_name: salexfy-db
    environment:
      POSTGRES_DB: salexfy
      POSTGRES_USER: salexfy
      POSTGRES_PASSWORD: salexfy
    ports:
      - "5432:5432"
    volumes:
      - salexfy_pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: salexfy-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/salexfy
      DB_USER: salexfy
      DB_PASSWORD: salexfy
      SALEXFY_ADMIN_USER: admin
      SALEXFY_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  salexfy_pgdata:
