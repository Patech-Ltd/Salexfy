spring.application.name=Salexfy

# --- Database (PostgreSQL) -------------------------------------------------
# Override via environment variables when deploying.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salexfy}
spring.datasource.username=${DB_USER:salexfy}
spring.datasource.password=${DB_PASSWORD:salexfy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Sync server -----------------------------------------------------------
server.port=${PORT:8080}

# Default admin account created on first boot.
salexfy.admin.username=${SALEXFY_ADMIN_USER:admin}
# Leave empty to auto-generate a random password (printed once in the log on first boot).
salexfy.admin.password=${SALEXFY_ADMIN_PASSWORD:}

# --- Misc ------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
logging.level.org.springframework.security=INFO

# --- Licensing -------------------------------------------------------------
# Signing key + pepper: set via env SALEXFY_LICENSE_PRIVATE_KEY / SALEXFY_LICENSE_PEPPER,
# otherwise generated once into ./data/license-keys (back this folder up!).
salexfy.license.lease-days=${SALEXFY_LICENSE_LEASE_DAYS:7}
server.forward-headers-strategy=${SALEXFY_FORWARD_HEADERS:none}
